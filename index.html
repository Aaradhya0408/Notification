<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priority Inbox - Stage 1</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f9; }
        h2 { color: #333; }
        .container { display: flex; gap: 20px; }
        .box { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .notification-item { padding: 10px; margin-bottom: 8px; border-radius: 4px; border-left: 5px solid; }
        .placement { background: #ffebee; border-left-color: #d32f2f; }
        .result { background: #e8f5e9; border-left-color: #2e7d32; }
        .event { background: #e3f2fd; border-left-color: #1565c0; }
        .rank { font-weight: bold; margin-right: 10px; color: #555; }
    </style>
</head>
<body>

    <h2>Stage 1: Priority Inbox Simulation</h2>
    <p>Click the button to simulate a live incoming notification stream.</p>
    <button onclick="simulateStream()">Start Notification Stream</button>

    <div class="container" style="margin-top: 20px;">
        <div class="box">
            <h3>Live Incoming Stream (All)</h3>
            <div id="live-stream"></div>
        </div>
        <div class="box">
            <h3>Top 10 Priority Inbox</h3>
            <div id="priority-inbox"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
